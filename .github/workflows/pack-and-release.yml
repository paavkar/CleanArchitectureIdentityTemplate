name: Pack and Release Template

on:
  push:
    branches:
      - main

jobs:
  pack-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CleanIdentityTemplate.csproj

      - name: Pack template
        run: dotnet pack CleanIdentityTemplate.csproj -c Release -o ./nupkgs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: main-build-${{ github.run_number }}
          name: "Main branch build ${{ github.run_number }}"
          files: ./nupkgs/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}